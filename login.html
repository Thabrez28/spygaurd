<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpyGuard | Secure Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="background">
        <div class="grid"></div>
    </div>

    <div class="login-container">

        <div class="logo">
            🛡️
        </div>

        <h1>SpyGuard</h1>

        <p class="subtitle">
            Spyware Detection & Threat Analysis
        </p>

        <div class="security-status">
            <span class="status-dot"></span>
            SYSTEM SECURE
        </div>

        <form method="POST" action="/login">

            <div class="input-group">
                <label>Username</label>
                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required>
            </div>

            <button type="submit">
                🔐 Secure Login
            </button>

        </form>

        <div class="footer">
            <span>Protected by SpyGuard Security Engine</span>
        </div>

    </div>

</body>
</html>
